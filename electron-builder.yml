appId: com.openskylight.app
productName: OpenSkyLight
directories:
  output: dist
  buildResources: resources
files:
  - out/**
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
npmRebuild: true
