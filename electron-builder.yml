appId: com.kitchenskylight.app
productName: Kitchen Skylight
directories:
  output: dist
  buildResources: resources
files:
  - out/**
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/ffmpeg-static/**
publish:
  provider: github
  owner: arndvs
  repo: kitchen-skylight
  releaseType: release
win:
  target:
    - nsis
    - portable
  # unsigned build — skip the signing/edit step so electron-builder doesn't
  # download the winCodeSign toolchain (whose 7z extraction needs symlink
  # privileges we don't have on this kiosk)
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
npmRebuild: true
