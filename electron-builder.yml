appId: com.kitchenskylight.app
productName: Kitchen Skylight
directories:
  output: dist
  buildResources: resources
files:
  - out/**
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/ffmpeg-static/**
publish:
  provider: github
  owner: arndvs
  repo: kitchen-skylight
  releaseType: release
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
npmRebuild: true
